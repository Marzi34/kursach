<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="container">
        <h2>Авторизация</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.username.label }}
                <br>
                {{ form.username }}
            </div>
            <div class="form-group">
                {{ form.password.label }}
                <br>
                {{ form.password }}
            </div>
            <button type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</body>
</html>

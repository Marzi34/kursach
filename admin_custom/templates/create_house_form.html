{% extends "base.html" %}
{% load static %}
{% block content %}
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<link rel="stylesheet" href="{% static 'css/house_detail.css' %}">
<div class="container mt-4">
    <h2 class="mb-3">Создание объекта</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Название</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            {{ form.description }}
        </div>

        <div class="mb-3">
            <label class="form-label">Адрес</label>
            {{ form.address }}
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Тип недвижимости</label>
                {{ form.type }}
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Состояние</label>
                {{ form.condition }}
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Агент</label>
                {{ form.agent }}
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Цена</label>
                {{ form.price }}
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Площадь (м²)</label>
                {{ form.size }}
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Комнат</label>
                {{ form.rooms }}
            </div>
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'houses_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}

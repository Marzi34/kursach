{% extends "base.html" %}
{% load static %}
{% block content %}
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<link rel="stylesheet" href="{% static 'css/house_detail.css' %}">
<div class="container mt-4">
    <h2 class="mb-3">Изменение запроса</h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Дата</label>
            {{ form.query_date }}
        </div>

        <div class="mb-3">
            <label class="form-label">Статус</label>
            {{ form.status }}
        </div>

        <div class="mb-3">
            <label class="form-label">Сообщение</label>
            {{ form.message }}
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Пользователь</label>
                {{ form.user }}
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Недвижимость</label>
                {{ form.property }}
            </div>
        </div>
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'houses_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
